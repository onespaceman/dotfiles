name: main_stack
services:
  # management
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    group_add: [131]
    networks: [pub]
    ports:
      - 8080:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/dockhand:/app/data
    labels:
      caddy: d.${URL}
      caddy.reverse_proxy: "{{upstreams 3000}}"

  # networking
  caddy:
    image: ghcr.io/serfriz/caddy-cloudflare-ddns-crowdsec-geoip-security-dockerproxy:latest
    container_name: caddy
    restart: unless-stopped
    networks: [pub]
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      - CADDY_INGRESS_NETWORKS=pub
      - CADDY_DOCKER_CADDYFILE_PATH=/base.caddy
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/caddy:/data
      - /docker/caddy/base.caddy:/base.caddy
    labels:
      caddy_0.dynamic_dns.provider: "cloudflare {env.CLOUDFLARE_TOKEN}"
      caddy_0.dynamic_dns.domains.spaceman\.one: "*"
      caddy_0.dynamic_dns.versions: "ipv6"
      # caddy_1: (pocketid_forwarder)
      # caddy_1.forward_auth: pocket-id:1411
      # caddy_1.forward_auth.uri: /api/auth/caddy
      # caddy_1.forward_auth.copy_headers: Remote-User Remote-Name Remote-Email Remote-Groups

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   networks: [pub]
  #   command: ["tunnel", "run"]
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # auth
  pocket-id:
    image: pocketid/pocket-id:v2
    container_name: pocketid
    restart: unless-stopped
    networks: [pub]
    user: 1000:100
    ports:
      - 1411:1411
    environment:
      - APP_URL=https://auth.${URL}
      - ENCRYPTION_KEY=${POCKETID_KEY}
      - SESSION_DURATION=1440
      - TRUST_PROXY=true
    volumes:
      - /docker/pocketid:/app/data
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      caddy: auth.${URL}
      caddy.reverse_proxy: "{{upstreams 1411}}"
      caddy.reverse_proxy.header_up_0: header_up Host {host}
      caddy.reverse_proxy.header_up_1: header_up X-Real-IP {remote_host}
      caddy.reverse_proxy.header_up_2: header_up X-Forwarded-For {remote_host}
      caddy.reverse_proxy.header_up_3: header_up X-Forwarded-Proto {scheme}


  # services
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    restart: unless-stopped
    networks: [pub]
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /mnt/3/mus/:/music
      - /mnt/1/dl/:/downloads
      - /docker/beets:/config

  calibre:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web
    restart: unless-stopped
    networks: [pub]
    ports:
      - 50005:8083/tcp
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /docker/calibre-web:/config
      - /mnt/3/book:/calibre-library
    labels:
      caddy: book.${URL}
      caddy.reverse_proxy: "{{upstreams 8083}}"

  git:
    image: codeberg.org/forgejo/forgejo:16-rootless
    container_name: git
    restart: unless-stopped
    user: 1000:100
    networks: [pub]
    ports:
      - 3999:3000
      - 2222:2222
    environment:
      - USER_UID=1000
      - USER_GID=100
      - FORGEJO__server__LANDING_PAGE=/explore/repos
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__SHOW_MILESTONES_DASHBOARD_PAGE=false
      - FORGEJO__service.explore__DISABLE_USERS_PAGE=true
      - FORGEJO__service.explore__DISABLE_ORGANIZATIONS_PAGE=true
      - FORGEJO__repository__DEFAULT_REPO_UNITS=repo.code,repo.releases
      - FORGEJO__repository__DEFAULT_MIRROR_UNITS=repo.code,repo.releases
      - FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true
      - FORGEJO__ui__SHOW_USER_EMAIL=false
    volumes:
      - /docker/forgejo:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro
    labels:
      caddy: git.${URL}
      caddy.reverse_proxy: "{{upstreams 3000}}"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks: [pub]
    ports:
      - 50500:8096 # http
      # - 50501:8920 # https
      - 7359:7359/udp
      - 1900:1900/udp
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=http://10.0.0.4:50500
    volumes:
      - /docker/jellyfin:/config
      - /mnt/1/mov/tv/:/data/tvshows
      - /mnt/1/mov/movies/:/data/movies
    labels:
      caddy: jf.${URL}
      caddy.reverse_proxy: "{{upstreams 8096}}"

  koito:
    image: gabehf/koito:latest
    container_name: koito
    restart: unless-stopped
    networks: [pub]
    ports:
      - 4110:4110
    volumes:
      - /docker/koito:/etc/koito
    labels:
      caddy: scrobble.${URL}
      caddy.reverse_proxy: "{{upstreams 4110}}"
  multi-scrobbler:
    image: ghcr.io/foxxmd/multi-scrobbler:latest
    container_name: multi-scrobbler
    restart: unless-stopped
    networks:
      - pub
    ports:
      - 9078:9078
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=100
      - CACHE_VALKEY=redis://scrobbler-cache:6379
    volumes:
      - /docker/multiscrobbler:/config
    labels:
      caddy: scrobbler.${URL}
      caddy.reverse_proxy: "{{upstreams 9078}}"
  scrobbler-cache:
    image: valkey/valkey:9-alpine
    container_name: scrobbler-cache
    restart: unless-stopped
    networks: [priv]
    volumes:
      - /docker/multiscrobbler/cache:/data

  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: unless-stopped
    depends_on: [miniflux-db]
    networks: [pub, priv]
    ports:
      - 51111:8080/tcp
    environment:
      - DATABASE_URL=postgres://${MINIFLUX_POSTGRES_USER}:${MINIFLUX_POSTGRES_PASSWORD}@miniflux-db/minifluxdb?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASSWORD}
      - OAUTH2_PROVIDER=oidc
      - OAUTH2_CLIENT_ID=${MINIFLUX_OIDC_ID}
      - OAUTH2_CLIENT_SECRET=${MINIFLUX_OIDC_SECRET}
      - OAUTH2_REDIRECT_URL=https://feed.${URL}/oauth2/oidc/callback
      - OAUTH2_OIDC_DISCOVERY_ENDPOINT=https://auth.${URL}
      - OAUTH2_OIDC_PROVIDER_NAME=PocketID
    labels:
      caddy: feed.${URL}
      caddy.reverse_proxy: "{{upstreams 8080}}"
  miniflux-db:
    image: postgres:18
    container_name: miniflux-db
    restart: unless-stopped
    networks: [priv]
    environment:
      - POSTGRES_DB=minifluxdb
      - POSTGRES_USER=${MINIFLUX_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MINIFLUX_POSTGRES_PASSWORD}
    volumes:
      - /docker/miniflux:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux", "-d", "minifluxdb"]
      interval: 10s
      start_period: 30s

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    networks: [pub]
    ports:
      - 55666:4533/tcp
    environment:
      - PUID=1000
      - PGID=100
    volumes:
      - /docker/navidrome:/data
      - /mnt/3/mus:/music
    labels:
      caddy: mus.${URL}
      caddy.reverse_proxy: "{{upstreams 4533}}"

  rt:
    image: ghcr.io/crazy-max/rtorrent-rutorrent:latest
    container_name: rt
    restart: unless-stopped
    networks: [pub]
    ports:
      - 6881:6881/udp # RT DHT
      - 55000:50000/tcp # RT Incoming
      - 50001:8080/tcp # RUT Webui
      - 8000:8000/tcp # XMLRPC
      - 9000:9000/tcp # WEBDAV
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /docker/rtorrent:/data
      - /docker/rtorrent/passwd:/passwd
      - /mnt/1/dl/downloads:/downloads
      - /mnt/1/dl/watch:/data/rtorrent/watch
    labels:
      caddy: rt.${URL}
      caddy.reverse_proxy: "{{upstreams 8080}}"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks: [pub, priv]
    ports:
      - 45000:8080
    environment:
      - SEARXNG_VALKEY_URL=valkey://searxng-cache:6379/0
    volumes:
      - /docker/searxng:/etc/searxng
      - /docker/searxng/cache:/var/cache/searxng
    labels:
      caddy: s.${URL}
      caddy.reverse_proxy: "{{upstreams 8080}}"
  searxng-cache:
    image: valkey/valkey:9-alpine
    container_name: searxng-cache
    restart: unless-stopped
    networks: [priv]
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    container_name: silverbullet
    restart: unless-stopped
    user: 1000:100
    networks: [pub]
    ports:
      - 3000:3000/tcp
    environment:
      - TZ=America/New_York
      - SB_REMEMBER_ME_HOURS=720
      - SB_USER=${SB_USER}
    volumes:
      - /home/spaceman/notes:/space
    labels:
      caddy: note.${URL}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  pub:
    name: pub
    driver: bridge
    enable_ipv6: true
  priv:
    name: priv
    driver: bridge
    internal: true

volumes:
  valkey-data:
    name: valkey-data
